<svg xmlns="http://www.w3.org/2000/svg" width="840" height="104" viewBox="0 0 840 104" role="img" aria-label="Открытые проекты в цифрах: нейросеть выигрывает 71,6 % партий в сапёр, тик симуляции 9,9 мс против 21 мс, Go SDK без внешних зависимостей">
<style>
  .tile{fill:#f6f8fa;stroke:#d0d7de}
  .num{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3b5998}
  .lbl{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57606a}
  @media (prefers-color-scheme:dark){
    .tile{fill:#161b22;stroke:#30363d}
    .num{fill:#7A95C9}
    .lbl{fill:#8b949e}
  }
</style>
<rect class="tile" x="0.5" y="0.5" width="268.3" height="103" rx="10"/>
<text class="num" x="134.7" y="50" text-anchor="middle">71,6 %</text>
<text class="lbl" x="134.7" y="80" text-anchor="middle">побед нейросети в сапёре</text>
<rect class="tile" x="285.8" y="0.5" width="268.3" height="103" rx="10"/>
<text class="num" x="420.0" y="50" text-anchor="middle">9,9 мс</text>
<text class="lbl" x="420.0" y="80" text-anchor="middle">тик на Rust против 21 мс</text>
<rect class="tile" x="571.2" y="0.5" width="268.3" height="103" rx="10"/>
<text class="num" x="705.3" y="50" text-anchor="middle">0</text>
<text class="lbl" x="705.3" y="80" text-anchor="middle">зависимостей у Go SDK</text>
</svg>